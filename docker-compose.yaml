version: '3.8'

services:
  api-data-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tt-data-pipeline
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LEVEL=${LEVEL:-country}          # override here to be used in file name: country, province, city, dma
    volumes:
      - ./data:/app/data       #link host folder data to data folder inside container
    command: ["python", "main.py"]
